<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍺 Gestión de Mesas - Taberna de Moe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            color: #333;
            font-size: 2em;
        }
        
        .stats {
            display: flex;
            gap: 20px;
        }
        
        .stat-item {
            text-align: center;
            padding: 10px 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        
        .mesas-grid {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            min-height: 600px;
            position: relative;
            background-image: 
                linear-gradient(rgba(200,200,200,.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(200,200,200,.2) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        
        .mesa {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border: 4px solid #fff;
        }
        
        .mesa:hover {
            transform: scale(1.1) translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        
        .mesa.libre {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
        }
        
        .mesa.ocupada {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }
        
        .mesa.reservada {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }
        
        .mesa-numero {
            font-size: 2.5em;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .mesa-capacidad {
            font-size: 0.9em;
            color: white;
            margin-top: 5px;
        }
        
        .mesa-personas {
            font-size: 0.8em;
            color: white;
            background: rgba(0,0,0,0.3);
            padding: 3px 10px;
            border-radius: 10px;
            margin-top: 5px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .modal-header {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #333;
        }
        
        .modal-body {
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }
        
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(250, 112, 154, 0.4);
        }
        
        .btn-secondary {
            background: #e0e0e0;
            color: #555;
        }
        
        .btn-secondary:hover {
            background: #d0d0d0;
        }
        
        .mesa-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .mesa-info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .mesa-info-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .mesa-info-label {
            font-weight: 600;
            color: #555;
        }
        
        .mesa-info-value {
            color: #333;
        }
        
        .total-cuenta {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🍺 Gestión de Mesas - Taberna de Moe</h1>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="stat-libres">0</div>
                    <div class="stat-label">Libres</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="stat-ocupadas">0</div>
                    <div class="stat-label">Ocupadas</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="stat-total">0</div>
                    <div class="stat-label">Total</div>
                </div>
            </div>
        </header>
        
        <div class="mesas-grid" id="mesas-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando mesas...</p>
            </div>
        </div>
    </div>
    
    <!-- Modal para abrir mesa -->
    <div class="modal" id="modal-abrir">
        <div class="modal-content">
            <div class="modal-header">🍺 Abrir Mesa <span id="modal-abrir-numero"></span></div>
            <div class="modal-body">
                <form id="form-abrir">
                    <div class="form-group">
                        <label>Número de Personas:</label>
                        <input type="number" id="input-personas" min="1" max="20" value="2" required>
                    </div>
                    <div class="form-group">
                        <label>Cliente (opcional):</label>
                        <select id="input-cliente">
                            <option value="">Cliente General</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Notas:</label>
                        <textarea id="input-notas" rows="3" placeholder="Comentarios adicionales..."></textarea>
                    </div>
                </form>
            </div>
            <div class="button-group">
                <button class="btn-secondary" onclick="cerrarModal('modal-abrir')">Cancelar</button>
                <button class="btn-primary" onclick="confirmarAbrirMesa()">Abrir Mesa</button>
            </div>
        </div>
    </div>
    
    <!-- Modal para mesa ocupada -->
    <div class="modal" id="modal-ocupada">
        <div class="modal-content">
            <div class="modal-header">Mesa <span id="modal-ocupada-numero"></span> - Ocupada</div>
            <div class="modal-body">
                <div class="mesa-info" id="info-mesa"></div>
                <div class="total-cuenta" id="total-cuenta">$0.00</div>
            </div>
            <div class="button-group">
                <button class="btn-secondary" onclick="cerrarModal('modal-ocupada')">Cancelar</button>
                <button class="btn-danger" onclick="confirmarCerrarMesa()">Cerrar Mesa</button>
            </div>
        </div>
    </div>
    
    <script>
        let mesas = [];
        let mesaSeleccionada = null;
        const API_BASE = '/api/mesas';
        
        // Cargar mesas al iniciar
        async function cargarMesas() {
            try {
                const response = await fetch(`${API_BASE}/`);
                mesas = await response.json();
                renderizarMesas();
                actualizarEstadisticas();
            } catch (error) {
                console.error('Error cargando mesas:', error);
            }
        }
        
        // Renderizar mesas en el grid
        function renderizarMesas() {
            const grid = document.getElementById('mesas-grid');
            grid.innerHTML = '';
            
            mesas.forEach(mesa => {
                const mesaEl = document.createElement('div');
                mesaEl.className = `mesa ${mesa.estado}`;
                mesaEl.style.left = `${mesa.posicion_x}px`;
                mesaEl.style.top = `${mesa.posicion_y}px`;
                mesaEl.onclick = () => clickMesa(mesa);
                
                let html = `
                    <div class="mesa-numero">${mesa.numero}</div>
                    <div class="mesa-capacidad">👥 ${mesa.capacidad}</div>
                `;
                
                if (mesa.sesion_activa) {
                    html += `<div class="mesa-personas">🔴 ${mesa.sesion_activa.numero_personas} pers.</div>`;
                }
                
                mesaEl.innerHTML = html;
                grid.appendChild(mesaEl);
            });
        }
        
        // Click en una mesa
        function clickMesa(mesa) {
            mesaSeleccionada = mesa;
            
            if (mesa.estado === 'libre') {
                mostrarModalAbrir(mesa);
            } else if (mesa.estado === 'ocupada') {
                mostrarModalOcupada(mesa);
            }
        }
        
        // Mostrar modal para abrir mesa
        async function mostrarModalAbrir(mesa) {
            document.getElementById('modal-abrir-numero').textContent = mesa.numero;
            
            // Cargar clientes
            try {
                const response = await fetch('/api/socios/');
                const clientes = await response.json();
                const select = document.getElementById('input-cliente');
                select.innerHTML = '<option value="">Cliente General</option>';
                clientes.forEach(cliente => {
                    if (!cliente.es_proveedor) {
                        select.innerHTML += `<option value="${cliente.id}">${cliente.nombre}</option>`;
                    }
                });
            } catch (error) {
                console.error('Error cargando clientes:', error);
            }
            
            document.getElementById('modal-abrir').classList.add('active');
        }
        
        // Mostrar modal para mesa ocupada
        async function mostrarModalOcupada(mesa) {
            document.getElementById('modal-ocupada-numero').textContent = mesa.numero;
            
            const infoDiv = document.getElementById('info-mesa');
            const sesion = mesa.sesion_activa;
            
            if (sesion) {
                infoDiv.innerHTML = `
                    <div class="mesa-info-item">
                        <span class="mesa-info-label">Cliente:</span>
                        <span class="mesa-info-value">${sesion.cliente || 'Cliente General'}</span>
                    </div>
                    <div class="mesa-info-item">
                        <span class="mesa-info-label">Personas:</span>
                        <span class="mesa-info-value">${sesion.numero_personas}</span>
                    </div>
                    <div class="mesa-info-item">
                        <span class="mesa-info-label">Hora Apertura:</span>
                        <span class="mesa-info-value">${new Date(sesion.fecha_inicio).toLocaleTimeString('es-ES')}</span>
                    </div>
                `;
                
                document.getElementById('total-cuenta').textContent = `$${sesion.total}`;
            }
            
            document.getElementById('modal-ocupada').classList.add('active');
        }
        
        // Confirmar apertura de mesa
        async function confirmarAbrirMesa() {
            const personas = document.getElementById('input-personas').value;
            const clienteId = document.getElementById('input-cliente').value;
            const notas = document.getElementById('input-notas').value;
            
            try {
                const data = {
                    numero_personas: parseInt(personas),
                    notas: notas
                };
                
                if (clienteId) {
                    data.cliente_id = clienteId;
                }
                
                const response = await fetch(`${API_BASE}/${mesaSeleccionada.id}/abrir/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    cerrarModal('modal-abrir');
                    await cargarMesas();
                } else {
                    const error = await response.json();
                    alert('Error: ' + (error.error || 'No se pudo abrir la mesa'));
                }
            } catch (error) {
                console.error('Error abriendo mesa:', error);
                alert('Error al abrir la mesa');
            }
        }
        
        // Confirmar cierre de mesa
        async function confirmarCerrarMesa() {
            if (!confirm('¿Cerrar la mesa y liberar?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/${mesaSeleccionada.id}/cerrar/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                if (response.ok) {
                    cerrarModal('modal-ocupada');
                    await cargarMesas();
                } else {
                    const error = await response.json();
                    alert('Error: ' + (error.error || 'No se pudo cerrar la mesa'));
                }
            } catch (error) {
                console.error('Error cerrando mesa:', error);
                alert('Error al cerrar la mesa');
            }
        }
        
        // Cerrar modal
        function cerrarModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
            mesaSeleccionada = null;
        }
        
        // Actualizar estadísticas
        function actualizarEstadisticas() {
            const libres = mesas.filter(m => m.estado === 'libre').length;
            const ocupadas = mesas.filter(m => m.estado === 'ocupada').length;
            
            document.getElementById('stat-libres').textContent = libres;
            document.getElementById('stat-ocupadas').textContent = ocupadas;
            document.getElementById('stat-total').textContent = mesas.length;
        }
        
        // Auto-refresh cada 30 segundos
        setInterval(cargarMesas, 30000);
        
        // Cargar al iniciar
        cargarMesas();
    </script>
</body>
</html>
